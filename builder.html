<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5faff"><title>Project Idea Builder — Alpha.HR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .builder-wrap{max-width:900px;margin:55px auto 100px;padding:0 24px}.builder-card{padding:clamp(24px,5vw,48px);background:#fff;border:1px solid #deedf8;border-radius:24px;box-shadow:var(--shadow)}.builder-card h1{font:700 clamp(36px,6vw,54px)/1.1 var(--display);letter-spacing:-2px;margin:18px 0}.builder-card>p{color:var(--muted);line-height:1.8}.builder-form{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:30px}.field{display:flex;flex-direction:column;gap:8px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#536b84}.field input,.field select,.field textarea{width:100%;padding:14px 15px;border:1px solid #dcebf7;border-radius:11px;background:#fafdff;font:13px var(--font);color:var(--ink);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#72bdf0;box-shadow:0 0 0 3px #8acfff25}.field textarea{min-height:115px;resize:vertical}.builder-result{margin-top:22px;padding:20px;border-radius:15px;background:#eff8ff;border:1px solid #d7edfc}.builder-result strong{font:600 17px var(--display)}.builder-result p{font-size:12px;color:#6d8196;line-height:1.7}.builder-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.back-link{display:inline-block;margin:24px 0;color:#258bdc;font-size:13px;font-weight:700}@media(max-width:600px){.builder-form{grid-template-columns:1fr}.field.full{grid-column:auto}}
  </style>
</head>
<body>
  <header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">A<span>.</span></span><span>Alpha<span class="brand-dot">.HR</span></span></a><a class="nav-contact" href="index.html">← Portfolio</a></header>
  <main class="builder-wrap"><div class="builder-card">
    <div class="eyebrow">ALPHA.HR / PROJECT PLANNER</div><h1>Let's shape your <span class="gradient-text">next idea.</span></h1>
    <p>Use this simple planner to describe a project idea. It prepares a message you can review and send by email.</p>
    <form id="projectForm" class="builder-form">
      <div class="field"><label for="name">Your name</label><input id="name" name="name" placeholder="Your name" required></div>
      <div class="field"><label for="email">Your email</label><input id="email" name="email" type="email" placeholder="you@example.com"></div>
      <div class="field"><label for="type">Project type</label><select id="type" name="type"><option>Website</option><option>Web application</option><option>AI / automation</option><option>OCR / text tool</option><option>Other idea</option></select></div>
      <div class="field"><label for="scope">Project size</label><select id="scope" name="scope"><option>Small concept</option><option>Medium project</option><option>Large project</option><option>Not sure yet</option></select></div>
      <div class="field full"><label for="details">Tell me about your idea</label><textarea id="details" name="details" placeholder="What would you like to build?" required></textarea></div>
      <div class="field full"><button class="btn btn-primary" type="submit">Prepare project message <span>↗</span></button></div>
    </form>
    <div class="builder-result" id="result" hidden><strong>Your project brief is ready.</strong><p id="resultText"></p><div class="builder-actions"><button class="btn btn-primary" id="emailBtn" type="button">Open email draft ↗</button><button class="btn btn-ghost" id="copyBtn" type="button">Copy brief</button></div></div>
  </div><a class="back-link" href="index.html">← Back to Alpha.HR portfolio</a></main>
  <script>
    (() => {
      const form = document.getElementById('projectForm');
      const result = document.getElementById('result');
      const resultText = document.getElementById('resultText');
      const emailBtn = document.getElementById('emailBtn');
      const copyBtn = document.getElementById('copyBtn');
      let brief = '';
      form.addEventListener('submit', event => {
        event.preventDefault();
        const data = new FormData(form);
        brief = `Hello Alpha.HR,\\n\\nI'd like to discuss a project.\\n\\nName: ${data.get('name')}\\nEmail: ${data.get('email') || 'Not provided'}\\nProject type: ${data.get('type')}\\nProject size: ${data.get('scope')}\\n\\nIdea details:\\n${data.get('details')}\\n\\nThank you.`;
        resultText.textContent = `${data.get('type')} · ${data.get('scope')} — Your message is ready to review.`;
        result.hidden = false;
        result.scrollIntoView({behavior:'smooth',block:'nearest'});
      });
      emailBtn.addEventListener('click', () => {
        window.location.href = `mailto:alpha.hayat.rat@gmail.com?subject=${encodeURIComponent('Project idea from ' + document.getElementById('name').value)}&body=${encodeURIComponent(brief)}`;
      });
      copyBtn.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(brief); copyBtn.textContent = 'Copied ✓'; }
        catch { copyBtn.textContent = 'Copy unavailable'; }
      });
    })();
  </script>
</body>
</html>
